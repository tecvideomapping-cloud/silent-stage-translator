<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telão de Legendas ao Vivo | Videomappingtech Stage Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.theme-transparent {
      background: transparent !important;
      background-color: transparent !important;
      color: #ffffff;
    }
    body.theme-transparent .subtitle-line {
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 16px rgba(0,0,0,0.95);
      -webkit-text-stroke: 1.5px rgba(0,0,0,0.9);
    }
    body.theme-lowerthird {
      background: transparent !important;
      background-color: transparent !important;
      color: #ffffff;
    }
    body.theme-lowerthird .subtitle-line {
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 10px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: inline-flex;
    }
    body.theme-chroma {
      background-color: #00ff00 !important;
      color: #ffffff !important;
    }
    body.theme-chroma .subtitle-line {
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 12px rgba(0,0,0,0.95);
      -webkit-text-stroke: 1.5px rgba(0,0,0,0.85);
    }
    body.theme-chroma #controlsHeader {
      background-color: rgba(0, 0, 0, 0.85);
      border-color: rgba(0, 255, 0, 0.4);
    }
    body.theme-chroma footer {
      color: #000000;
      opacity: 0.6;
      font-weight: 600;
    }
    body.theme-black { background-color: #000000; color: #ffffff; }
    body.theme-dark { background-color: #090d16; color: #e2e8f0; }

    .subtitle-line {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="theme-lowerthird min-h-screen flex flex-col justify-between p-8 font-sans overflow-hidden select-none">

  <!-- Barra de Configurações (Oculta automaticamente em apresentação) -->
  <header id="controlsHeader" class="flex flex-wrap items-center justify-between opacity-40 hover:opacity-100 transition-opacity duration-300 bg-slate-900/60 backdrop-blur p-3 rounded-xl border border-slate-800 gap-2">
    <div class="flex items-center gap-3">
      <span class="text-xs font-bold uppercase tracking-wider text-cyan-400">Videomappingtech Screen</span>
      <span id="roomTag" class="text-xs bg-slate-800 px-2.5 py-1 rounded-md text-slate-300 font-mono">Sala: demo</span>
      <span id="liveDot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
    </div>

    <div class="flex flex-wrap items-center gap-2 sm:gap-3">
      <label class="text-xs text-slate-300">Posição:</label>
      <select id="screenPositionSelect" onchange="changePosition(this.value)" class="bg-slate-800 text-xs text-slate-200 px-2 py-1 rounded border border-slate-700">
        <option value="pos-bottom" selected>⬇️ Rodapé (Inferior)</option>
        <option value="pos-top">⬆️ Topo (Superior)</option>
        <option value="pos-center">⏺️ Centro da Tela</option>
      </select>

      <label class="text-xs text-slate-300">Fundo:</label>
      <select id="screenThemeSelect" onchange="changeTheme(this.value)" class="bg-slate-800 text-xs text-slate-200 px-2 py-1 rounded border border-slate-700">
        <option value="theme-transparent">🪟 100% Transparente (Sobreposição)</option>
        <option value="theme-lowerthird" selected>⬛ Tarja Translúcida (Lower-Third)</option>
        <option value="theme-chroma">🟢 Verde Chroma Key (vMix/OBS)</option>
        <option value="theme-black">⚫ Preto (LED/Projetor)</option>
        <option value="theme-dark">🔵 Azul Escuro</option>
      </select>

      <label class="text-xs text-slate-300">Idioma:</label>
      <select id="screenLangSelect" onchange="changeScreenLang(this.value)" class="bg-slate-800 text-xs text-slate-200 px-2 py-1 rounded border border-slate-700">
        <option value="all">Todas / Tradução Ativa</option>
        <option value="en">Inglês (English)</option>
        <option value="es">Espanhol (Español)</option>
        <option value="original">Original (Transcrição)</option>
      </select>

      <label class="text-xs text-slate-300">Marca:</label>
      <select id="screenLogoLocalSelect" onchange="changeScreenLogo(this.value)" class="bg-slate-800 text-xs text-slate-200 px-2 py-1 rounded border border-slate-700">
        <option value="vmp">Video Mapping</option>
        <option value="client">Logo do Cliente</option>
        <option value="none">Ocultar Marca</option>
      </select>

      <div class="flex items-center gap-1">
        <button onclick="adjustFontSize(-4)" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded text-slate-200 font-bold">A-</button>
        <button onclick="adjustFontSize(4)" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded text-slate-200 font-bold">A+</button>
      </div>

      <button onclick="toggleFullScreen()" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3 py-1 rounded font-semibold transition">
        ⛶ Tela Cheia
      </button>
    </div>
  </header>

  <!-- Área de Legendas com Posicionamento Dinâmico -->
  <main id="screenMainArea" class="flex-1 flex flex-col items-center text-center px-6 transition-all duration-300 justify-end pb-10">
    <div id="subtitlesContainer" class="w-full max-w-5xl flex flex-col gap-4 text-4xl sm:text-5xl lg:text-6xl font-bold leading-tight tracking-normal">
      <p class="text-slate-600 text-2xl font-normal italic">Aguardando início do áudio no palco...</p>
    </div>
  </main>

  <!-- Marca d'água no Canto Inferior Direito -->
  <div id="screenWatermarkBox" class="fixed bottom-6 right-8 z-20 pointer-events-none transition-opacity duration-300 opacity-90">
    <img id="watermarkVMP" src="/logo_VMP.svg" alt="Video Mapping" class="h-16 w-auto filter drop-shadow-lg">
    <img id="watermarkClient" src="" alt="Logo do Cliente" class="h-16 w-auto filter drop-shadow-lg hidden">
  </div>

  <!-- Rodapé discreto -->
  <footer class="text-center py-2 opacity-30 text-xs">
    <span>Legendas geradas em tempo real com IA • Videomappingtech</span>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = decodeURIComponent(urlParams.get('room') || urlParams.get('roomId') || 'palco1').trim().toLowerCase();
    document.getElementById('roomTag').innerText = `Sala: ${roomId}`;

    let socket = null;
    let fontSize = 52;

    let currentScreenLang = urlParams.get('lang') || 'all';
    let screenMode = 'single';
    let allowedLangs = [currentScreenLang];

    let currentScreenLogo = 'vmp';
    let clientLogoUrl = '';

    async function loadRoomDetails() {
      try {
        const res = await fetch(`/api/rooms/${roomId}`);
        if (res.ok) {
          const room = await res.json();
          if (room.logo_url) {
            clientLogoUrl = room.logo_url;
            const clientImg = document.getElementById('watermarkClient');
            if (clientImg) clientImg.src = clientLogoUrl;
          }
        }
      } catch (e) {}
    }

    function changeScreenLogo(logoChoice) {
      currentScreenLogo = logoChoice;
      const vmpEl = document.getElementById('watermarkVMP');
      const clientEl = document.getElementById('watermarkClient');
      const box = document.getElementById('screenWatermarkBox');

      if (document.getElementById('screenLogoLocalSelect')) {
        document.getElementById('screenLogoLocalSelect').value = logoChoice;
      }

      if (logoChoice === 'none') {
        if (box) box.classList.add('hidden');
      } else if (logoChoice === 'client') {
        if (box) box.classList.remove('hidden');
        if (vmpEl) vmpEl.classList.add('hidden');
        if (clientEl) {
          if (clientLogoUrl) {
            clientEl.src = clientLogoUrl;
            clientEl.classList.remove('hidden');
          } else {
            // Se cliente não tiver logo cadastrada, exibe a logo VMP como fallback seguro
            if (vmpEl) vmpEl.classList.remove('hidden');
          }
        }
      } else {
        // vmp
        if (box) box.classList.remove('hidden');
        if (vmpEl) vmpEl.classList.remove('hidden');
        if (clientEl) clientEl.classList.add('hidden');
      }
    }

    function changeScreenLang(lang) {
      currentScreenLang = lang;
      allowedLangs = lang === 'all' ? ['original', 'en', 'es'] : [lang];
      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      window.history.replaceState({}, '', url);
    }

    function connectScreenWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}?roomId=${encodeURIComponent(roomId)}&role=screen`;
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        document.getElementById('liveDot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          
          if (data.type === 'screen_config') {
            // Comando vindo do Administrador pelo painel do Host
            screenMode = data.screenMode || 'single';
            if (data.screenTheme) {
              changeTheme(data.screenTheme);
            }
            if (data.screenPosition) {
              changePosition(data.screenPosition);
            }
            if (data.screenLogo) {
              changeScreenLogo(data.screenLogo);
            }
            if (data.selectedLangs && Array.isArray(data.selectedLangs)) {
              allowedLangs = data.selectedLangs;
              currentScreenLang = allowedLangs[0] || 'all';
              if (document.getElementById('screenLangSelect')) {
                document.getElementById('screenLangSelect').value = currentScreenLang;
              }
            }
            return;
          }

          if (data.type === 'subtitle') {
            // Legenda original (transcrição do palco)
            if (currentScreenLang === 'all' || allowedLangs.includes('original') || allowedLangs.includes('all')) {
              displaySubtitle(data.text, data.isFinal, 'original');
            } else if (!data.isFinal) {
              // Mesmo quando a tela estiver em modo traduzido, exibe a fala instantânea
              // enquanto a tradução da frase de 4 palavras está a caminho
              displayInterimActivity(data.text);
            }
          } else if (data.type === 'subtitle_translated') {
            // Legenda traduzida
            if (currentScreenLang === 'all' || allowedLangs.includes(data.lang) || allowedLangs.includes('all')) {
              displaySubtitle(data.text, true, data.lang);
            }
          }
        } catch (e) {}
      };

      socket.onclose = () => {
        document.getElementById('liveDot').className = 'w-2.5 h-2.5 rounded-full bg-red-500';
        setTimeout(connectScreenWS, 2500);
      };
    }

    let screenInterimEl = null;

    function displayInterimActivity(text) {
      const container = document.getElementById('subtitlesContainer');
      if (!container || !text) return;
      if (container.querySelector('.text-slate-600')) {
        container.innerHTML = '';
      }
      if (!screenInterimEl || !screenInterimEl.parentNode) {
        screenInterimEl = document.createElement('div');
        screenInterimEl.className = 'subtitle-line flex items-center justify-center gap-3 opacity-90 italic';
        container.appendChild(screenInterimEl);
      }
      screenInterimEl.innerHTML = `
        <span class="text-xs sm:text-sm font-mono border px-2 py-0.5 rounded-md bg-cyan-500/20 text-cyan-300 border-cyan-500/40 uppercase">AO VIVO 🎙️</span>
        <span class="text-cyan-300" style="font-size: ${Math.round(fontSize * 0.9)}px;">${text}...</span>
      `;
    }

    const langBadges = {
      'original': { label: 'AO VIVO', color: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40' },
      'en': { label: 'EN 🇺🇸', color: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' },
      'es': { label: 'ES 🇪🇸', color: 'bg-amber-500/20 text-amber-300 border-amber-500/40' }
    };

    function displaySubtitle(text, isFinal, lang = 'original') {
      const container = document.getElementById('subtitlesContainer');
      if (!container || !text) return;
      
      // Limpa mensagem inicial
      if (container.querySelector('.text-slate-600')) {
        container.innerHTML = '';
      }

      const badgeInfo = langBadges[lang] || { label: lang.toUpperCase(), color: 'bg-slate-800 text-slate-300 border-slate-700' };

      if (isFinal) {
        if (screenInterimEl && screenInterimEl.parentNode) {
          screenInterimEl.remove();
          screenInterimEl = null;
        }

        // Se a última linha final for idêntica e do mesmo idioma, não duplica
        const lastFinal = container.querySelector('.subtitle-line-final:last-child');
        if (lastFinal && lastFinal.dataset.text === text.trim() && lastFinal.dataset.lang === lang) {
          return;
        }

        // Mantém blocos adequados para cadência simultânea contínua
        const maxLines = allowedLangs.length > 1 ? 5 : 3;
        const existing = container.querySelectorAll('.subtitle-line-final');
        if (existing.length >= maxLines) {
          existing[0].remove();
        }

        const div = document.createElement('div');
        div.className = 'subtitle-line subtitle-line-final flex items-center justify-center gap-3 drop-shadow-md';
        div.dataset.text = text.trim();
        div.dataset.lang = lang;
        
        // Mostra badge do idioma se estiver em modo multilíngue ou bilíngue
        const showBadge = allowedLangs.length > 1 || currentScreenLang === 'all';
        div.innerHTML = `
          ${showBadge ? `<span class="text-xs sm:text-sm font-mono border px-2 py-0.5 rounded-md ${badgeInfo.color} uppercase">${badgeInfo.label}</span>` : ''}
          <span class="text-white" style="font-size: ${fontSize}px;">${text}</span>
        `;
        container.appendChild(div);
      } else {
        if (!screenInterimEl || !screenInterimEl.parentNode) {
          screenInterimEl = document.createElement('div');
          screenInterimEl.className = 'subtitle-line flex items-center justify-center gap-3 opacity-90 italic';
          container.appendChild(screenInterimEl);
        }
        screenInterimEl.innerHTML = `
          <span class="text-xs sm:text-sm font-mono border px-2 py-0.5 rounded-md ${badgeInfo.color} uppercase">${badgeInfo.label}</span>
          <span class="text-cyan-400" style="font-size: ${fontSize}px;">${text}...</span>
        `;
      }
    }

    let currentTheme = urlParams.get('theme') || 'theme-lowerthird';
    let currentPosition = urlParams.get('pos') || 'pos-bottom';

    function changePosition(pos) {
      currentPosition = pos || 'pos-bottom';
      const main = document.getElementById('screenMainArea');
      if (main) {
        main.classList.remove('justify-end', 'justify-start', 'justify-center', 'pb-10', 'pb-12', 'pt-12', 'pt-4', 'py-6');
        if (currentPosition === 'pos-top') {
          main.classList.add('justify-start', 'pt-12', 'pb-4');
        } else if (currentPosition === 'pos-center') {
          main.classList.add('justify-center', 'py-6');
        } else {
          // pos-bottom (rodapé)
          main.classList.add('justify-end', 'pb-12', 'pt-4');
        }
      }
      const sel = document.getElementById('screenPositionSelect');
      if (sel) sel.value = currentPosition;
    }

    function changeTheme(themeName) {
      currentTheme = themeName || 'theme-lowerthird';
      document.body.className = `${currentTheme} min-h-screen flex flex-col justify-between p-8 font-sans overflow-hidden select-none`;
      const sel = document.getElementById('screenThemeSelect');
      if (sel) sel.value = currentTheme;
    }

    function adjustFontSize(delta) {
      fontSize = Math.max(28, Math.min(96, fontSize + delta));
      document.querySelectorAll('.subtitle-line').forEach(el => {
        el.style.fontSize = fontSize + 'px';
      });
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    changePosition(currentPosition);
    changeTheme(currentTheme);
    loadRoomDetails();
    connectScreenWS();
  </script>
</body>
</html>
