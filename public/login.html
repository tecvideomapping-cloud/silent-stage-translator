<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo | Videomappingtech</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-cyan-500 selection:text-white">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl flex flex-col gap-6">
    
    <div class="text-center flex flex-col items-center">
      <div class="w-12 h-12 rounded-2xl bg-cyan-950 border border-cyan-800 flex items-center justify-center text-2xl text-cyan-400 mb-3">
        🔐
      </div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-500 bg-clip-text text-transparent">
        Videomappingtech Console
      </h1>
      <p class="text-xs text-slate-400 mt-1">Acesso restrito para operadores e administradores</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="flex flex-col gap-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-300 mb-1">E-mail Administrativo:</label>
        <input type="email" id="loginEmail" required placeholder="admin@videomappingtech.com"
          class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 focus:border-cyan-500 focus:outline-none text-sm">
      </div>

      <div>
        <label class="block font-semibold text-slate-300 mb-1">Senha de Acesso:</label>
        <input type="password" id="loginPassword" required placeholder="••••••••••••"
          class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 focus:border-cyan-500 focus:outline-none text-sm font-mono">
      </div>

      <div id="errorAlert" class="hidden p-3 bg-rose-950/80 border border-rose-800 text-rose-300 rounded-xl text-xs text-center">
        Credenciais inválidas. Verifique seu e-mail e senha.
      </div>

      <button type="submit" id="submitBtn"
        class="mt-2 w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg transition active:scale-95 text-sm">
        Entrar no Painel
      </button>
    </form>

    <div class="text-center text-[11px] text-slate-500 pt-3 border-t border-slate-800/80">
      <p>Acesso protegido por autenticação de sessão criptografada.</p>
    </div>

  </div>

  <script>
    // Se já estiver logado, redireciona direto
    const existingToken = localStorage.getItem('vmt_admin_token');
    if (existingToken) {
      fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${existingToken}` } })
        .then(res => {
          if (res.ok) window.location.href = '/admin.html';
        });
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorAlert');
      btn.disabled = true;
      btn.innerText = 'Autenticando...';
      errEl.classList.add('hidden');

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('vmt_admin_token', data.token);
          localStorage.setItem('vmt_user', JSON.stringify(data.user));
          window.location.href = '/admin.html';
        } else {
          errEl.innerText = data.error || 'Credenciais inválidas.';
          errEl.classList.remove('hidden');
          btn.disabled = false;
          btn.innerText = 'Entrar no Painel';
        }
      } catch (err) {
        errEl.innerText = 'Falha na conexão com o servidor.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = 'Entrar no Painel';
      }
    }
  </script>
</body>
</html>
