name: Compilar Instaladores Desktop (Windows & Mac)

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar para ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            npm_command: npm run pack:win
            artifact_pattern: dist/*.exe
          - os: macos-latest
            arch: arm64
            npm_command: npx electron-builder --mac dmg zip --arm64
            artifact_pattern: dist/*.dmg
          - os: macos-latest
            arch: x64
            npm_command: npx electron-builder --mac dmg zip --x64
            artifact_pattern: dist/*.dmg

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Testes Automatizados
        run: npm test

      - name: Compilar Instalador Nativo
        run: ${{ matrix.npm_command }}

      - name: Upload do Artefato Compilado (${{ matrix.os }} - ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: silent-stage-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.*
          if-no-files-found: warn
